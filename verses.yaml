- ref: ヨハネによる福音書 3章16節
  text: 神はそのひとり子を賜わったほどに、この世を愛して下さった。それは御子を信じる者がひとりも滅びないで、永遠の命を得るためである。
  ref_en: John 3:16
  text_en: For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life.

- ref: 詩篇 23篇1節
  text: 主はわたしの牧者であって、わたしには乏しいことがない。
  ref_en: Psalm 23:1
  text_en: The LORD is my shepherd; I shall not want.

- ref: マタイによる福音書 11章28節
  text: すべて重荷を負うて苦労している者は、わたしのもとにきなさい。あなたがたを休ませてあげよう。
  ref_en: Matthew 11:28
  text_en: Come to me, all who labor and are heavy laden, and I will give you rest.

- ref: イザヤ書 41章10節
  text: 恐れてはならない、わたしはあなたと共にいる。驚いてはならない、わたしはあなたの神である。わたしはあなたを強くし、あなたを助け、わが勝利の右の手をもって、あなたをささえる。
  ref_en: Isaiah 41:10
  text_en: Fear not, for I am with you; be not dismayed, for I am your God; I will strengthen you, I will help you, I will uphold you with my righteous right hand.

- ref: コリント人への第一の手紙 13章4節
  text: 愛は寛容であり、愛は情深い。また、ねたむことをしない。愛は高ぶらない、誇らない、
  ref_en: 1 Corinthians 13:4
