- ref: ヨハネによる福音書 3章16節
  text: 神はそのひとり子を賜わったほどに、この世を愛して下さった。それは御子を信じる者がひとりも滅びないで、永遠の命を得るためである。

- ref: 詩篇 23篇1節
  text: 主はわたしの牧者であって、わたしには乏しいことがない。

- ref: マタイによる福音書 11章28節
  text: すべて重荷を負うて苦労している者は、わたしのもとにきなさい。あなたがたを休ませてあげよう。

- ref: イザヤ書 41章10節
  text: 恐れてはならない、わたしはあなたと共にいる。驚いてはならない、わたしはあなたの神である。わたしはあなたを強くし、あなたを助け、わが勝利の右の手をもって、あなたをささえる。

- ref: コリント人への第一の手紙 13章4節
  text: 愛は寛容であり、愛は情深い。また、ねたむことをしない。愛は高ぶらない、誇らない、
