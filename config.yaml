# ===== 東京ソフィア長老教会 Instagram 自動投稿 設定ファイル =====
# ここに書いた情報だけが投稿に使われます（AIが事実を作り出さないようにするため）。

instagram:
  username: tokyosophia
  user_id: "17841445487867831"   # Metaの「API setup with Unified login」画面に表示されるID

# ===== 配信スケジュール（日本時間）=====
# 予定時刻の12時間前から GitHub が待機を始め、予定時刻ちょうどに投稿します。
# （GitHubの定時起動は何時間も遅れることがあるため、早めに起動して時刻まで待つ仕組みです）
# 予定時刻を59分過ぎても投稿できなかったときは投稿せず、GitHubからメールで知らせます。
# ここに予定を書き足すだけで動きます（.github/workflows/post.yml の変更は不要）。
# 毎週の予定は weekday、1回だけの臨時投稿は date（YYYY-MM-DD）で書きます。
schedule:
  - { weekday: tuesday,   time: "18:00", lang: ja, theme: midweek }
  - { weekday: wednesday, time: "18:00", lang: en, theme: midweek }
  - { weekday: saturday,  time: "17:00", lang: ja, theme: sunday }
  - { weekday: saturday,  time: "18:00", lang: en, theme: sunday }
  # 日曜礼拝の報告（日曜夜に Mac の確認ページで写真と文章を承認したものを投稿）
  - { weekday: monday,    time: "06:00", lang: ja, theme: report }
  - { weekday: monday,    time: "06:00", lang: en, theme: report }
  # --- 臨時投稿（1回だけ） ---
  - { date: "2026-11-19", time: "18:00", lang: ja, theme: midweek }
  - { date: "2026-11-19", time: "18:00", lang: en, theme: midweek }

# ===== 言語ごとの設定 =====
languages:
  ja:
    church:
      name: 東京ソフィア長老教会
      denomination: 日本オリベットアッセンブリー
      address: 東京都新宿区高田馬場1-33-15 TFT高田馬場駅前ビル301
      access: JR高田馬場駅 戸山口から徒歩3分
      website: https://tokyosophia.org
      services:
        - name: 日本語礼拝
          time: 毎週日曜 11:00〜12:00（開場 10:30）
      welcome_message: どなたでもお気軽にお越しください。初めての方も歓迎いたします。
    themes:
      midweek:
        headline: 今週のみことば
        instruction: >-
          週の半ばに読む人を励ます短い黙想文を書いてください。
          みことばから一つの気づきを、日常に結びつけて優しく語ってください。
          最後に今週の日曜の日本語礼拝への招きを一文添えてください。
      sunday:
        headline: 主日礼拝のご案内
        instruction: >-
          明日の日曜の日本語礼拝へのお誘いの投稿を書いてください。
          みことばに軽く触れつつ、初めての人も安心して来られるよう温かく招いてください。
    caption:
      max_chars: 400
      max_hashtags: 5      # Instagramは1投稿5個まで（2025年12月〜）
      fixed_hashtags:
        - "#東京ソフィア長老教会"
        - "#TokyoSophiaPresbyterianChurch"
        - "#キリスト教"
        - "#聖書"
      hashtag_pool:        # AIが内容に合うものを毎回選ぶ（tokyosophia.org の内容から作成）
        - "#高田馬場"
        - "#高田馬場教会"
        - "#新宿"
        - "#新宿教会"
        - "#東京の教会"
        - "#教会"
        - "#キリスト教会"
        - "#プロテスタント"
        - "#長老教会"
        - "#礼拝"
        - "#日曜礼拝"
        - "#聖書"
        - "#みことば"
        - "#聖書の言葉"
        - "#聖書を読む"
        - "#キリスト教"
        - "#クリスチャン"
        - "#祈り"
        - "#生きる意味"
        - "#人生の意味"
        - "#孤独"
        - "#心の支え"
        - "#初めての教会"

  en:
    church:
      name: Tokyo Sophia Presbyterian Church
      denomination: Olivet Assembly of Japan
      address: TFT Takadanobaba Ekimae Bldg. 301, 1-33-15 Takadanobaba, Shinjuku-ku, Tokyo
      access: 3 min walk from JR Takadanobaba Station (Toyama Exit)
      website: https://tokyosophia.org/en/
      services:
        - name: English Service
          time: Every Sunday 14:00–15:00 (doors open 13:30)
      welcome_message: Everyone is welcome — first-time visitors, too!
    themes:
      midweek:
        headline: Verse of the Week
        instruction: >-
          Write a short, encouraging midweek devotional.
          Draw one insight from the verse and gently connect it to everyday life.
          End with a one-sentence invitation to this Sunday's English Service.
      sunday:
        headline: Sunday Worship
        instruction: >-
          Write a warm invitation to tomorrow's English Service.
          Touch lightly on the verse, and help first-time visitors and people new to Tokyo feel at ease.
    caption:
      max_chars: 600       # 英語は文字数が多くなるため
      verse_suffix: " (ESV)"   # 英語の章節の後ろに付ける（ESVの引用規定）
      max_hashtags: 5
      fixed_hashtags:
        - "#TokyoSophiaPresbyterianChurch"
        - "#EnglishChurchTokyo"
        - "#Christianity"
        - "#Bible"
      hashtag_pool:
        - "#TokyoChurch"
        - "#ChurchInTokyo"
        - "#Takadanobaba"
        - "#Shinjuku"
        - "#InternationalChurch"
        - "#EnglishService"
        - "#SundayWorship"
        - "#Presbyterian"
        - "#BibleVerse"
        - "#VerseOfTheWeek"
        - "#Scripture"
        - "#Faith"
        - "#Christian"
        - "#ChristianLife"
        - "#Prayer"
        - "#Hope"
        - "#TokyoLife"
        - "#ExpatsInTokyo"
        - "#LivingInTokyo"
        - "#MeaningOfLife"

ai:
  model: claude-opus-5-5
  effort: medium

image:
  width: 1080
  height: 1350             # 4:5 縦長（Instagram推奨）
  overlay_opacity: 0.55    # 背景写真にかける暗い幕の濃さ（0〜1）
  # 写真が取れないときの背景色（上→下のグラデーション）
  fallback_colors:
    midweek: ["#1f3b4d", "#3d6e7a"]
    sunday: ["#5a3e2b", "#a7774f"]
  # 上から順に存在するフォントを使います
  fonts:
    - /usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc      # GitHub Actions (Ubuntu)
    - /System/Library/Fonts/ヒラギノ明朝 ProN.ttc                 # macOS
    - /System/Library/Fonts/Hiragino Sans GB.ttc                # macOS 予備

# ===== 背景写真 =====
# 1) backgrounds/<季節>/ に自分の写真（.jpg/.png）を入れると、そちらを優先して使います
#    季節フォルダ名: spring(3-5月) summer(6-8月) autumn(9-11月) winter(12-2月)
# 2) なければ Pixabay（商用無料・クレジット不要）から季節に合う写真を自動で選びます
backgrounds:
  search_queries:
    # 看板や電話番号が写り込みにくい「自然・夜景・遠景」を中心にしています
    spring: ["cherry blossom japan", "sakura tree", "tokyo skyline spring"]
    summer: ["japanese garden green", "blue sky clouds", "tokyo skyline"]
    autumn: ["japan autumn leaves", "ginkgo autumn", "maple leaves autumn"]
    winter: ["tokyo night skyline", "tokyo tower night", "winter illumination"]
