name: Instagram 自動投稿

on:
  schedule:
    # 時刻はUTC表記（日本時間 − 9時間）
    # ※GitHub Actions の定時実行は数分〜数十分遅れることがあります
    - cron: "0 9 * * 2"   # 火曜 18:00 日本語
    - cron: "0 9 * * 3"   # 水曜 18:00 英語
    - cron: "0 8 * * 6"   # 土曜 17:00 日本語
    - cron: "0 9 * * 6"   # 土曜 18:00 英語
  workflow_dispatch:
    inputs:
      lang:
        description: "言語"
        type: choice
        options: [ja, en]
        default: ja
      date:
        description: "投稿日 (YYYY-MM-DD)。空欄なら今日"
        required: false
      dry_run:
        description: "画像と文章を作るだけで投稿しない"
        type: boolean
        default: false
      remake:
        description: "作成済み（未投稿）の画像と文章を作り直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      # 手動実行なら選んだ言語、定時実行ならcronの時刻から言語を決める
      LANG_CODE: ${{ inputs.lang || ((github.event.schedule == '0 9 * * 2' || github.event.schedule == '0 8 * * 6') && 'ja' || 'en') }}
      DATE_ARG: ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      REMAKE_ARG: ${{ inputs.remake && '--remake' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 日本語フォントとライブラリをインストール
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt

      - name: 投稿内容を作成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py prepare --lang "$LANG_CODE" $DATE_ARG $REMAKE_ARG

      - name: 作成した画像と文章をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts state
          git diff --cached --quiet || git commit -m "投稿を作成: ${LANG_CODE} ${{ inputs.date || 'today' }}"
          git pull --rebase && git push

      - name: Instagram に投稿
        if: ${{ !inputs.dry_run }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          # Instagram が画像を取得できるよう、公開リポジトリの固定URLを渡す
          export IMAGE_BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)"
          python main.py publish --lang "$LANG_CODE" $DATE_ARG

      - name: 投稿結果を保存
        if: ${{ !inputs.dry_run }}
        run: |
          git add posts
          git diff --cached --quiet || git commit -m "投稿完了を記録: ${LANG_CODE}"
          git pull --rebase && git push
