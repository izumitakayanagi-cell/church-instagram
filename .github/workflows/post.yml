name: Instagram 自動投稿
# 一覧に表示される名前（どの実行か見分けやすくする）
run-name: ${{ (github.event_name != 'workflow_dispatch' || inputs.auto) && '定時チェック（予定があれば投稿）' || format('{0} {1} {2}{3}', inputs.date || '今日', inputs.lang == 'en' && '英語' || '日本語', inputs.dry_run && '試し作成' || '投稿', inputs.remake && '（作り直し）' || '') }}

on:
  schedule:
    # 毎日 16:13〜20:43（日本時間）に30分おきに起動し、config.yaml の予定で
    # 「予定時刻から3時間以内・未投稿」のものがあれば投稿する。
    # GitHubの定時実行は遅れたり飛ばされたりすることがあるため、何度も確認している。
    # 混雑する「0分ちょうど」を避けて13分・43分にしている。時刻はUTC表記（日本時間 − 9時間）
    - cron: "13,43 7-11 * * *"   # 毎日 16:13〜20:43
    - cron: "13,43 21-23 * * 0"  # 月曜 6:13〜8:43（日曜礼拝の報告）
    - cron: "13,43 0-3 * * 1"    # 月曜 9:13〜12:43（遅れたときの予備）
  # Mac から trigger/ フォルダを更新して送ると、すぐに「定時チェック」が動く
  # （GitHub の定時実行は何時間も遅れることがあるため、確実に動かす手段として使う）
  push:
    paths: ["trigger/**"]
  workflow_dispatch:
    inputs:
      lang:
        description: "言語"
        type: choice
        options: [ja, en]
        default: ja
      date:
        description: "投稿日 (YYYY-MM-DD)。空欄なら今日"
        required: false
      dry_run:
        description: "画像と文章を作るだけで投稿しない"
        type: boolean
        default: false
      remake:
        description: "作成済み（未投稿）の画像と文章を作り直す"
        type: boolean
        default: false
      auto:
        description: "定時チェックとして動かす（予定表どおりに投稿。他の項目は無視）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write   # 投稿漏れをIssueで知らせる（GitHubからメールが届く）

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      IS_SCHEDULE: ${{ github.event_name != 'workflow_dispatch' || inputs.auto }}
      LANG_CODE: ${{ inputs.lang || 'ja' }}
      DATE_ARG: ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      REMAKE_ARG: ${{ inputs.remake && '--remake' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 日本語フォントとライブラリをインストール
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt

      - name: 投稿内容を作成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ "$IS_SCHEDULE" = "true" ]; then
            python main.py auto-prepare
          else
            python main.py prepare --lang "$LANG_CODE" $DATE_ARG $REMAKE_ARG
          fi

      - name: 作成した画像と文章をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts state
          git diff --cached --quiet || git commit -m "投稿を作成"
          git pull --rebase && git push

      - name: Instagram に投稿
        if: ${{ !inputs.dry_run || inputs.auto }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          # Instagram が画像を取得できるよう、公開リポジトリの固定URLを渡す
          export IMAGE_BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)"
          if [ "$IS_SCHEDULE" = "true" ]; then
            python main.py auto-publish
          else
            python main.py publish --lang "$LANG_CODE" $DATE_ARG
          fi

      - name: 投稿漏れの確認
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.auto) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python main.py check-missed
          if [ -f missed_report.md ]; then
            gh issue create --repo "${{ github.repository }}" --title "⚠️ Instagramの予定投稿ができませんでした" --body-file missed_report.md
          fi

      - name: 投稿結果を保存
        if: ${{ always() && (!inputs.dry_run || inputs.auto) }}
        run: |
          git add -A posts state
          git diff --cached --quiet || git commit -m "投稿結果を記録"
          git pull --rebase && git push
